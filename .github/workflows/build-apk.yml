name: Build Nuvio Enhanced APK

on:
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: wrapper

      - name: Prepare build environment
        run: |
          touch local.properties
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=1536m" >> ~/.gradle/gradle.properties
          echo "org.gradle.configuration-cache=false" >> ~/.gradle/gradle.properties

      - name: Set up Rust
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
          cargo install cargo-ndk --locked

      - name: Restore release keystore from secrets
        run: |
          echo "$NUVIO_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nuvio-enhanced.jks"
        env:
          NUVIO_RELEASE_KEYSTORE_BASE64: ${{ secrets.NUVIO_RELEASE_KEYSTORE_BASE64 }}

      - name: Build Android Release APK
        run: ./gradlew :androidApp:assembleFullRelease --stacktrace
        env:
          NUVIO_RELEASE_STORE_FILE: ${{ runner.temp }}/nuvio-enhanced.jks
          NUVIO_RELEASE_STORE_PASSWORD: ${{ secrets.NUVIO_RELEASE_STORE_PASSWORD }}
          NUVIO_RELEASE_KEY_ALIAS: ${{ secrets.NUVIO_RELEASE_KEY_ALIAS }}
          NUVIO_RELEASE_KEY_PASSWORD: ${{ secrets.NUVIO_RELEASE_KEY_PASSWORD }}

      - name: Locate and Collect APKs
        id: collect-apks
        run: |
          mkdir -p build-apks
          find androidApp/build/outputs/apk/ -name "*.apk" -exec cp {} build-apks/ \;
          ls -la build-apks/

      - name: Pack dev build zip
        run: |
          mkdir -p dist
          zip -9 -j "dist/Infuse-dev-${{ github.run_number }}.zip" build-apks/*.apk
          ls -lh dist

      - name: Publish dev build draft (owner only)
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: dev-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Dev build ${{ github.run_number }}
          body: Dev build (owner only).
          files: dist/*.zip
